services:
  rank-engine:
    build:
      context: .
      args:
        RANK_BASE_IMAGE: ${RANK_BASE_IMAGE:-pytorch/pytorch:2.8.0-cuda12.9-cudnn9-runtime}
        PIP_INDEX_URL: ${RANK_PIP_INDEX_URL:-https://pypi.org/simple}
      additional_contexts:
        algorithm: ../rec-algorithm
    image: openrec/rank-engine:latest
    container_name: rank-engine
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MODEL_TYPE: lr
      MODEL_PATH: /bootstrap-models/rank/default/lr.pth
      MODEL_FEATURE_PATH: /bootstrap-models/feature/default/lr.features.json
      MODEL_REQUIRED: "false"
      MODEL_DEVICE: auto
      FEATURE_REFRESH_SECONDS: 300
      RANK_WORKERS: 1
    volumes:
      - openrec-model-artifacts:/models
      - ../model:/bootstrap-models:ro
    ports:
      - "8123:8123"
    networks:
      - openrec-bigdata

networks:
  openrec-bigdata:
    external: true
    name: openrec-bigdata

volumes:
  openrec-model-artifacts:
    name: openrec-model-artifacts
