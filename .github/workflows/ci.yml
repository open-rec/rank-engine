name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out rank engine
        uses: actions/checkout@v7
        with:
          path: rank-engine
      - name: Check out algorithm contracts
        uses: actions/checkout@v7
        with:
          repository: open-rec/rec-algorithm
          path: rec-algorithm
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            rank-engine/requirements*.txt
            rec-algorithm/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e rec-algorithm
          python -m pip install -r rank-engine/requirements.txt -r rank-engine/requirements-test.txt
      - name: Run tests
        working-directory: rank-engine
        run: python -m pytest -q test
